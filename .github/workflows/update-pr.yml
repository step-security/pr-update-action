name: "Update Pull Request"

on:
  pull_request:
    branches:
      - main

jobs:
  update_pr:
    runs-on: ubuntu-latest
    outputs:
      baseMatch: ${{ steps.update_pr.outputs.baseMatch }}
      headMatch: ${{ steps.update_pr.outputs.headMatch }}
      titleUpdated: ${{ steps.update_pr.outputs.titleUpdated }}
      bodyUpdated: ${{ steps.update_pr.outputs.bodyUpdated }}
    steps:
      - uses: actions/checkout@v7
      - id: update_pr
        uses: ./
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          head-branch-regex: '[a-z\d-_.\/]+'
          title-template: "[updated-by-action]"
          body-template: "[Updated by Pull Request Updater action]"
  update_pr_outputs:
    runs-on: ubuntu-latest
    needs: update_pr
    steps:
      - run: |
          echo "baseMatch: $BASE_MATCH"
          echo "headMatch: $HEAD_MATCH"
          echo "titleUpdated: $TITLE_UPDATED"
          echo "bodyUpdated: $BODY_UPDATED"
        env:
          BASE_MATCH: ${{ needs.update_pr.outputs.baseMatch }}
          HEAD_MATCH: ${{ needs.update_pr.outputs.headMatch }}
          TITLE_UPDATED: ${{ needs.update_pr.outputs.titleUpdated }}
          BODY_UPDATED: ${{ needs.update_pr.outputs.bodyUpdated }}
